# Manual helper: applies `dart format` with Flutter stable and commits the
# result to the selected branch. Useful when no local Dart SDK is available.
# Commits pushed by this workflow do not trigger CI; run "Flutter CI" manually
# afterwards (Actions → Flutter CI → Run workflow).
name: Apply dart format

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format
        run: |
          flutter pub get
          dart format lib test

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "Already formatted."
            exit 0
          fi
          git diff --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "style: apply dart format"
          git push
