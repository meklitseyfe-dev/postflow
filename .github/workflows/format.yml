# Temporary helper: applies `dart format` with CI's Flutter stable and commits
# the result. Run manually; remove once formatting matches CI.
name: Apply dart format

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format
        run: |
          flutter pub get
          dart format lib test

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "Already formatted."
            exit 0
          fi
          git diff --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "style: apply dart format"
          git push
